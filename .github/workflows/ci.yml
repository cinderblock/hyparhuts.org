name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Playwright builds and previews the site itself, so this covers the
      # deployed artifact rather than the dev server.
      - name: Run tests
        run: bun run test --project=chromium

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/client
          retention-days: 7

# Deploy is deliberately absent: publishing goes through the `ops` repo
# (github.com/cinderblock/ops) as a Cloudflare Workers deploy, wired up once
# the site content is settled. See wrangler.jsonc for the target shape.
