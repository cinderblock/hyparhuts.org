<!--
  The hypar roof in plan: a square whose four edges all curve inward, leaving
  points at the corners. That is the actual cut pattern (see the SolidWorks
  roof plan), and it survives being shrunk to 16px, which a wireframe saddle
  would not.

  This is the dark-scheme variant — shown when the browser chrome is dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#f2ede3" />
  <path
    d="M6 5.5 Q16 11.5 26 5.5 Q20 16 26 26.5 Q16 20.5 6 26.5 Q12 16 6 5.5 Z"
    fill="#b4531f"
  />
</svg>
